  const head=['التاريخ','الوقت','الموظف','المنتج','النكهة','العدد','سعر القطعة','الخصم','الإجمالي','الدفع','الزبون','القناة','رقم الفاتورة'];
  const rows=list.map(x=>{const p=prod(x.productId);const t=new Date(N(x.createdAt)||Date.parse(x.date));return [x.date,`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`,x.by||'',p?dn(p):'منتج محذوف',p?.flavor||'',N(x.qty),N(x.unitPrice),N(x.discount),saleTot(x),x.payment||'نقد',x.customer||'',x.channel==='online'?'أونلاين':'المحل',x.ticket||'']});
  const sum=[[],['كشف حساب',empName(sel)],['الفترة',from,to],['إجمالي المبيعات',st.rev],['نقد',st.by['نقد']],['تحويل',st.by['تحويل']],['آجل',st.by['آجل']],['الخصومات',st.disc],['عدد الفواتير',st.n],['القطع',st.units]];

  return '﻿'+[head,...rows,...sum].map(r=>r.map(q).join(',')).join('\r\n');
}

function meter(p,stock){const cap=Math.max(N(p.minStock??3)*3,1);const pct=Math.min(100,Math.round(stock/cap*100));const cls=stock<=0?'bad':stock<=N(p.minStock??3)?'warn':'';return `<span class="meter ${cls}" aria-hidden="true"><i style="width:${Math.max(pct,stock>0?6:0)}%"></i></span>`}
function renderResults(){const r=$('#results');if(!r)return;r.innerHTML=ui.view==='sell'?sellCards():stockTable()}

/* STOCK */
function viewStock(){
  const ps=activeProducts();
  const val=ps.reduce((s,p)=>s+(INV[p.id]?.value||0),0);
  const out=ps.filter(p=>(INV[p.id]?.stock||0)<=0).length;
  const low=ps.filter(p=>{const s=INV[p.id]?.stock||0;return s>0&&s<=N(p.minStock??3)}).length;
  const exp=ps.filter(p=>status(p).some(s=>/ينتهي|منتهي/.test(s[0]))).length;
  return `${sampleNotice()}
  ${head('الجرد والمنتجات',`${ps.length} منتج${C()?` • قيمة المخزون ${moneyT(val)}`:''}`,can('products')?`<button class="btn primary" data-act="new-product">${I.plus} منتج جديد</button>`:'')}
  <div class="kpis">
    <div class="kpi"><span>منتجات</span><b>${ps.length}</b><em>${ps.reduce((s,p)=>s+(INV[p.id]?.stock||0),0)} قطعة بالمخزن</em></div>
    <div class="kpi"><span>نافد</span><b class="${out?'neg':''}">${out}</b><em>يحتاج شراء</em></div>
    <div class="kpi"><span>قليل</span><b style="${low?'color:var(--warn)':''}">${low}</b><em>تحت الحد الأدنى</em></div>
    <div class="kpi"><span>قرب الانتهاء</span><b style="${exp?'color:var(--warn)':''}">${exp}</b><em>خلال 60 يوم أو منتهي</em></div>
  </div>
  <div class="bar">${searchBar('ابحث بالمخزون…',true).replace('<div class="bar">','').replace(/<\/div>$/,'')}
    <select id="stockFilter" aria-label="الحالة">${[['all','كل الحالات'],['out','نافد'],['low','قليل'],['exp','قرب الانتهاء'],['ok','متوفر']].map(([k,l])=>`<option value="${k}" ${ui.stockFilter===k?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="panel" id="results">${stockTable()}</div>

}
function stockTable(){
  let ps=activeProducts().filter(matchQ);

  if(f!=='all')ps=ps.filter(p=>{const st=status(p).map(s=>s[0]).join(' ');return f==='out'?/نافد/.test(st):f==='low'?/قليل/.test(st):f==='exp'?/ينتهي|منتهي/.test(st):/متوفر/.test(st)});
  if(!S.products.length)return `<div class="empty"><b>المخزن فارغ</b>أضف منتجاتك وحدة وحدة، وتقدر تكتب الكمية الأولية وسعر شرائها بنفس الخطوة.<br>${can('products')?`<button class="btn primary" data-act="new-product">${I.plus} أضف منتج</button>`:''}</div>`;
  if(!ps.length)return `<div class="empty"><b>ماكو منتجات تطابق الفلتر</b>غيّر البحث أو الحالة.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>المنتج</th><th>الصنف</th><th>بالمخزن</th>${C()?'<th>متوسط الكلفة</th>':''}<th>سعر البيع</th>${C()?'<th>الربح بالقطعة</th>':''}<th>أقرب انتهاء</th><th>الحالة</th><th></th></tr></thead><tbody>
  ${ps.map(p=>{const m=INV[p.id]||{stock:0,avg:0,nextExp:''};const pr=N(p.sellPrice)-(m.avg||0);
    return `<tr><td><div class="pcell">${pthumb(p)}<div><b>${esc(dn(p))}</b> ${p.sample?'<span class="tag">مثال</span>':''}<span class="sub">${esc([p.brand,pdesc(p)].filter(Boolean).join(' • '))}</span></div></div></td>
    <td><span class="tag">${esc(p.category||'—')}</span></td>
    <td class="n" style="min-width:90px"><b>${m.stock}</b> <span class="sub" style="display:inline">قطعة</span>${meter(p,m.stock)}</td>
    ${C()?`<td class="n">${m.avg?moneyT(m.avg):'—'}</td>`:''}<td class="n">${moneyT(N(p.sellPrice))}</td>
    ${C()?`<td class="n ${pr>=0?'pos':'neg'}">${m.avg?moneyT(pr):'—'}</td>`:''}
    <td class="n">${fmtDate(m.nextExp)}</td><td>${pills(status(p))}</td>
    <td><div class="rowact">
      ${can('sell')?`<button class="icon-btn" title="بيع" aria-label="بيع" data-act="sell" data-id="${p.id}" ${m.stock<=0?'disabled':''}>${I.sell}</button>`:''}
      ${can('buy')?`<button class="icon-btn" title="شراء / إضافة كمية" aria-label="شراء" data-act="buy" data-id="${p.id}">${I.buy}</button>`:''}
      ${can('count')?`<button class="icon-btn" title="جرد وتعديل الكمية" aria-label="جرد" data-act="count" data-id="${p.id}">${I.count}</button>`:''}
      ${can('products')?`<button class="icon-btn" title="تعديل المنتج" aria-label="تعديل" data-act="edit-product" data-id="${p.id}">${I.edit}</button>
      <button class="icon-btn del" title="حذف المنتج" aria-label="حذف" data-act="del-product" data-id="${p.id}">${I.trash}</button>`:''}
    </div></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function adjLog(){
  const a=[...S.adjustments].sort((x,y)=>(y.date||'').localeCompare(x.date||'')||(y.createdAt||0)-(x.createdAt||0)).slice(0,20);
  if(!a.length)return '';
  return `<div class="panel"><h3>سجل تعديلات الجرد <span>آخر ${a.length}</span></h3><div class="list">${a.map(x=>{const p=prod(x.productId);const d=N(x.delta);
   return `<div class="li"><div class="grow"><b>${esc(pname(p))}</b><span>${fmtDate(x.date)} • ${esc(x.reason||'')}${x.note?' • '+esc(x.note):''}${x.by?' • '+esc(x.by):''}</span></div><b class="num ${d>=0?'pos':'neg'}">${d>0?'+':''}${d}</b>${canDelRec(x)?`<button class="icon-btn del" aria-label="حذف" data-act="del-adj" data-id="${x.id}">${I.trash}</button>`:''}</div>`}).join('')}</div></div>`;
}
function deleteProduct(id){
  const p=prod(id);if(!p)return;
  const used=S.sales.some(s=>s.productId===id)||S.purchases.some(s=>s.productId===id)||S.adjustments.some(s=>s.productId===id);
  if(used)confirmSheet('إخفاء المنتج',`"${esc(p.name)}" عليه عمليات مسجّلة، فراح نخفيه من القوائم ونخلي سجلاته بالتقارير.`,'أخفِ المنتج',()=>updDoc('products',id,{archived:true}));
  else confirmSheet('حذف المنتج',`راح ينحذف "${esc(p.name)}" نهائياً.`,'احذف',()=>delDoc('products',id));
}

function salesTable(list,compact){
  if(!list.length)return `<div class="empty"><b>ماكو مبيعات بهذي الفترة</b>${compact?'اختار منتج من فوق وسجّل أول بيع.':'غيّر الفترة أو سجّل بيع جديد.'}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${compact?'':'<th>التاريخ</th>'}<th>المنتج</th><th>العدد × السعر</th><th>الخصم</th><th>الإجمالي</th>${C()?'<th>الربح</th>':''}<th>الدفع</th><th>الزبون</th>${isAdmin()?'<th>البائع</th>':''}<th></th></tr></thead><tbody>
  ${list.map(x=>{const p=prod(x.productId);const tot=N(x.qty)*N(x.unitPrice)-N(x.discount);const pr=tot-N(x.cost);
   const payCls=x.payment==='آجل'?'p-warn':x.payment==='تحويل'?'p-mute':'p-good';
   return `<tr>${compact?'':`<td class="n">${fmtDate(x.date)}</td>`}<td><b>${esc(pname(p))}</b> ${x.sample?'<span class="tag">مثال</span>':''}<span class="sub">${esc(pdesc(p))}</span></td>
   <td class="n">${N(x.qty)} × ${moneyT(N(x.unitPrice))}</td><td class="n">${N(x.discount)?moneyT(N(x.discount)):'—'}</td><td class="n"><b>${moneyT(tot)}</b></td>
   ${C()?`<td class="n ${pr>=0?'pos':'neg'}">${moneyT(pr)}</td>`:''}<td><span class="pill ${payCls}">${esc(x.payment||'نقد')}</span></td><td>${esc(x.customer||'—')}</td>${isAdmin()?`<td>${esc(x.by||'—')}</td>`:''}
   <td><div class="rowact">${canDelRec(x)?`<button class="icon-btn del" aria-label="حذف" data-act="del-sale" data-id="${x.id}">${I.trash}</button>`:''}</div></td></tr>`}).join('')}
  </tbody></table></div>`;
}

     ${fld('iCost','كلفة القطعة',inp('iCost','number','','inputmode="numeric" min="0" step="250"'))}
     ${fld('iExp','تاريخ الانتهاء',inp('iExp','date',''))}</div></div>`:''}
   <div id="pErr" class="err" hidden></div>
  </form>
  <div class="sheet-actions"><button class="btn primary" id="pSave">${isNew?'حفظ المنتج':'حفظ التعديلات'}</button><button class="btn ghost" id="pCancel">إلغاء</button></div>`,s=>{
    s.querySelector('#pCancel').onclick=closeSheet;
    const imgSt={v:p.img||''};wireImg(s,imgSt);
    const save=async()=>{
      const v=id=>s.querySelector('#'+id)?.value.trim()||'';
      const err=s.querySelector('#pErr');
      if(!v('pName')){err.hidden=false;err.textContent='اكتب اسم المنتج.';return}
      if(!(N(v('pPrice'))>0)){err.hidden=false;err.textContent='اكتب سعر البيع للقطعة.';return}
      const iq=N(v('iQty'));
      if(isNew&&iq>0&&!(N(v('iCost'))>0)){err.hidden=false;err.textContent='اكتب كلفة القطعة حتى ينحسب الربح صح.';return}
      const data={name:v('pName'),brand:v('pBrand'),category:v('pCat'),flavor:v('pFlavor'),size:v('pSize'),sellPrice:N(v('pPrice')),minStock:N(v('pMin')),barcode:v('pCode'),desc:v('pDesc').slice(0,400),online:!!s.querySelector('#pOnline')?.checked,img:imgSt.v||''};
      const btn=s.querySelector('#pSave');btn.disabled=true;
      try{
        if(isNew){
          if(mode==='db'){const ref=db.collection('products').doc();await ref.set({...data,createdAt:Date.now()});
            if(iq>0)await addDoc('purchases',{productId:ref.id,qty:iq,unitCost:N(v('iCost')),expiry:v('iExp'),date:todayStr(),supplier:'',note:'رصيد أولي'});}
          else{const id=uid();S.products.push({id,...data,createdAt:Date.now()});if(iq>0)S.purchases.push({id:uid(),productId:id,qty:iq,unitCost:N(v('iCost')),expiry:v('iExp'),date:todayStr(),supplier:'',note:'رصيد أولي',createdAt:Date.now()});saveLocal();render()}
          toast('انضاف المنتج');
        }else{await updDoc('products',p.id,data);toast('انحفظ التعديل')}
        closeSheet();
      }catch(e){btn.disabled=false;dbErr(e)}
    };
    s.querySelector('#pSave').onclick=save;
    s.querySelector('#pf').addEventListener('submit',e=>{e.preventDefault();save()});
  });
}

function saleSheet(pid){
  const p=prod(pid);if(!p)return;const m=INV[pid]||{stock:0};
  openSheet(`<h3>بيع: ${esc(p.name)}</h3><p class="sub">${esc([p.brand,pdesc(p)].filter(Boolean).join(' • '))} • متوفر ${m.stock} قطعة</p>
  <form class="form" id="sf" novalidate>
   ${fld('sQty','العدد (قطعة)',`<div class="stepper"><button type="button" id="sMinus" aria-label="نقص">−</button>${inp('sQty','number',1,'inputmode="numeric" min="1"')}<button type="button" id="sPlus" aria-label="زيد">+</button></div>`,'full')}
   ${fld('sPrice','سعر القطعة (د.ع)',inp('sPrice','number',N(p.sellPrice),'inputmode="numeric" min="0" step="250"'))}
   ${fld('sDisc','خصم على العملية (د.ع)',inp('sDisc','number','','inputmode="numeric" min="0" step="250" placeholder="0"'))}
   ${fld('sPay','طريقة الدفع',`<select id="sPay">${PAY.map(x=>`<option>${x}</option>`).join('')}</select>`)}
   ${fld('sDate','التاريخ',inp('sDate','date',todayStr()))}
   ${fld('sCust','اسم الزبون (اختياري)',inp('sCust','text','','placeholder="ضروري إذا آجل"'),'full')}
   <div class="summary" id="sSum"></div>
   <div id="sErr" class="err" hidden></div>
  </form>
  <div class="sheet-actions"><button class="btn primary" id="sSave">تسجيل البيع</button><button class="btn ghost" id="sCancel">إلغاء</button></div>`,s=>{
    const q=s.querySelector('#sQty');
    const calc=()=>{const qty=Math.max(0,Math.floor(N(q.value)));const tot=qty*N(s.querySelector('#sPrice').value)-N(s.querySelector('#sDisc').value);const c=fifoCost(pid,qty);
      s.querySelector('#sSum').innerHTML=`${C()?`<div><span>الكلفة التقديرية</span><span class="num">${moneyT(c)}</span></div><div><span>الربح</span><span class="num ${tot-c>=0?'pos':'neg'}">${moneyT(tot-c)}</span></div>`:''}<div class="total"><span>المطلوب من الزبون</span><span class="num">${moneyT(tot)}</span></div><div style="font-size:12.5px;color:var(--muted)"><span>يبقى بالمخزن بعد البيع</span><span>${Math.max(0,m.stock-qty)} قطعة</span></div>`};
    s.querySelector('#sMinus').onclick=()=>{q.value=Math.max(1,Math.floor(N(q.value))-1);calc()};
    s.querySelector('#sPlus').onclick=()=>{q.value=Math.floor(N(q.value))+1;calc()};
    s.addEventListener('input',calc);calc();
    s.querySelector('#sCancel').onclick=closeSheet;
    const save=async()=>{
      const err=s.querySelector('#sErr');const qty=Math.floor(N(q.value));const price=N(s.querySelector('#sPrice').value);const disc=N(s.querySelector('#sDisc').value);
      const pay=s.querySelector('#sPay').value;const cust=s.querySelector('#sCust').value.trim();
      const show=t=>{err.hidden=false;err.textContent=t};
      if(qty<1)return show('العدد لازم يكون قطعة وحدة على الأقل.');
      if(qty>m.stock)return show(`المتوفر ${m.stock} قطعة بس. سجّل شراء أو عدّل الجرد أولاً.`);
      if(!(price>0))return show('اكتب سعر القطعة.');
      if(disc>qty*price)return show('الخصم أكبر من قيمة البيع.');
      if(pay==='آجل'&&!cust)return show('اكتب اسم الزبون للبيع الآجل حتى تعرف منو مطلوب.');
      const btn=s.querySelector('#sSave');btn.disabled=true;
      try{await addDoc('sales',{productId:pid,qty,unitPrice:price,discount:disc,payment:pay,customer:cust,date:s.querySelector('#sDate').value||todayStr(),cost:Math.round(fifoCost(pid,qty))});
        toast(`انباع ${qty} × ${p.name}`);closeSheet()}catch(e){btn.disabled=false;dbErr(e)}
    };
    s.querySelector('#sSave').onclick=save;
    s.querySelector('#sf').addEventListener('submit',e=>{e.preventDefault();save()});
  });
}

function adjustSheet(pid){
  const p=prod(pid);if(!p)return;const m=INV[pid]||{stock:0};
  openSheet(`<h3>جرد: ${esc(p.name)}</h3><p class="sub">${esc(pdesc(p))} • حسب السجلات: <b>${m.stock}</b> قطعة. اكتب العدد الموجود فعلاً على الرف.</p>
  <form class="form" id="af" novalidate>
   ${fld('aCount','العدد الفعلي',inp('aCount','number',m.stock,'inputmode="numeric" min="0"'))}
   ${fld('aReason','السبب',`<select id="aReason">${ADJ_REASONS.map(x=>`<option>${x}</option>`).join('')}</select>`)}
   ${fld('aNote','ملاحظة',inp('aNote','text','','placeholder="اختياري"'),'full')}
   <div class="summary" id="aSum"></div>
   <div id="aErr" class="err" hidden></div>
  </form>
  <div class="sheet-actions"><button class="btn primary" id="aSave">حفظ الجرد</button><button class="btn ghost" id="aCancel">إلغاء</button></div>`,s=>{
    const calc=()=>{const d=Math.floor(N(s.querySelector('#aCount').value))-m.stock;
      s.querySelector('#aSum').innerHTML=`<div class="total"><span>الفرق</span><span class="num ${d>0?'pos':d<0?'neg':''}">${d>0?'+':''}${d} قطعة</span></div><div style="font-size:12.5px;color:var(--muted)">${d<0?`خسارة تقديرية ${moneyT(fifoCost(pid,-d))}`:d>0?'تنضاف بمتوسط الكلفة الحالي':'المخزون مطابق للسجلات'}</div>`};
    s.addEventListener('input',calc);calc();
    s.querySelector('#aCancel').onclick=closeSheet;
    const save=async()=>{
      const raw=s.querySelector('#aCount').value;const err=s.querySelector('#aErr');
      if(raw===''||N(raw)<0){err.hidden=false;err.textContent='اكتب العدد الفعلي (صفر أو أكثر).';return}
      const d=Math.floor(N(raw))-m.stock;
      if(d===0){toast('المخزون مطابق، ما احتاج تعديل');closeSheet();return}
      const btn=s.querySelector('#aSave');btn.disabled=true;
      try{await addDoc('adjustments',{productId:pid,delta:d,reason:s.querySelector('#aReason').value,note:s.querySelector('#aNote').value.trim(),date:todayStr()});
        toast('انحفظ الجرد');closeSheet()}catch(e){btn.disabled=false;dbErr(e)}
    };
    s.querySelector('#aSave').onclick=save;
    s.querySelector('#af').addEventListener('submit',e=>{e.preventDefault();save()});
  });
}

function saveTheme(){try{localStorage.setItem('dz-theme4',JSON.stringify(TH))}catch(e){}}
function applyTheme(){
  const r=document.documentElement.style;
  r.setProperty('--cy',TH.cy);r.removeProperty('--mg');
  const root=document.documentElement;root.classList.toggle('m-light',TH.mode==='light');root.classList.toggle('m-dark',TH.mode==='dark');
  const h=TH.cy.replace('#','');const L=h.length===6?(0.299*parseInt(h.slice(0,2),16)+0.587*parseInt(h.slice(2,4),16)+0.114*parseInt(h.slice(4,6),16)):0;
  r.setProperty('--accent-ink',L>165?'#0b0b0c':'#ffffff');
  document.body.classList.toggle('no-anim',!TH.anim);
}
applyTheme();
(function tick(){const nw=new Date(),hs=[nw.getHours(),nw.getMinutes(),nw.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');document.querySelectorAll('.dhc').forEach(e=>e.textContent=hs);const c=$('#clk');if(c){const d=new Date();c.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}setTimeout(tick,1000-(Date.now()%1000))})();

<script>/* Buttons 2.0: ripple, haptic tick, busy spinner, success flash */
(function(){
  const RSEL='.btn,.hbtn,.tab,.chip,.cat,.tgl,.pay-b,.flv,.seg button,.icon-btn,.gear,.sw,.kbtn,.add,.qs button,.big-qs button,.cb,.fab';
  const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('pointerdown',e=>{
    const b=e.target.closest(RSEL);if(!b||b.disabled||e.button>0||reduce())return;
    const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');
    const solid=b.matches('.primary,.red,.wa,.add,.cta,[aria-pressed="true"],.on,.act,.sell-btn');
    sp.className='rpl'+(solid?'':' dk');sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    b.appendChild(sp);setTimeout(()=>sp.remove(),650);
    try{if(e.pointerType==='touch'&&navigator.vibrate)navigator.vibrate(8)}catch(x){}
  },{passive:true});
  let lastBtn=null,lastAt=0;
  document.addEventListener('click',e=>{const b=e.target.closest('button,.btn');if(b){lastBtn=b;lastAt=Date.now();window.dzLast=b}},true);
  new MutationObserver(ms=>{for(const m of ms){const b=m.target;if(!b.classList||!b.classList.contains('btn'))continue;
    if(b.disabled&&b===lastBtn&&Date.now()-lastAt<1500)b.classList.add('busy');
    else if(!b.disabled&&b.classList.contains('busy')){b.classList.remove('busy');b.classList.add('okf');setTimeout(()=>b.classList.remove('okf'),700)}}})
    .observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});
  window.dzFly=function(from,to){try{if(!from||!to||reduce())return;const a=from.getBoundingClientRect(),z=to.getBoundingClientRect(),f=document.createElement('i');
    f.className='fly';f.style.left=(a.left+a.width/2)+'px';f.style.top=(a.top+a.height/2)+'px';document.body.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${z.left+z.width/2-a.left-a.width/2}px,${z.top+z.height/2-a.top-a.height/2}px) scale(.5) rotate(180deg)`;f.style.opacity='.3'});
    setTimeout(()=>{f.remove();to.classList.remove('pop');void to.offsetWidth;to.classList.add('pop')},660)}catch(x){}};
})();
</script>
