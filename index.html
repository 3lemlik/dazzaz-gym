  const rev=list.reduce((s,x)=>s+N(x.qty)*N(x.unitPrice)-N(x.discount),0);
  const cost=list.reduce((s,x)=>s+N(x.cost),0);
  const units=list.reduce((s,x)=>s+N(x.qty),0);
  const disc=list.reduce((s,x)=>s+N(x.discount),0);
  const byPay={};PAY.forEach(p=>byPay[p]=0);list.forEach(x=>{byPay[x.payment||'نقد']=(byPay[x.payment||'نقد']||0)+N(x.qty)*N(x.unitPrice)-N(x.discount)});
  return `${sampleNotice()}

    <div class="kpi"><span>صافي الربح</span><b class="${rev-cost>=0?'pos':'neg'}">${money(rev-cost)}</b><em>هامش ${rev?Math.round((rev-cost)/rev*100):0}%</em></div>`:`<div class="kpi"><span>آجل</span><b>${money(byPay['آجل']||0)}</b><em>مطلوب من الزبائن</em></div>

function salesTable(list,compact){
  if(!list.length)return `<div class="empty"><b>ماكو مبيعات بهذي الفترة</b>${compact?'اختار منتج من فوق وسجّل أول بيع.':'غيّر الفترة أو سجّل بيع جديد.'}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${compact?'':'<th>التاريخ</th>'}<th>المنتج</th><th>العدد × السعر</th><th>الخصم</th><th>الإجمالي</th>${C()?'<th>الربح</th>':''}<th>الدفع</th><th>الزبون</th>${isAdmin()?'<th>البائع</th>':''}<th></th></tr></thead><tbody>
  ${list.map(x=>{const p=prod(x.productId);const tot=N(x.qty)*N(x.unitPrice)-N(x.discount);const pr=tot-N(x.cost);
   const payCls=x.payment==='آجل'?'p-warn':x.payment==='تحويل'?'p-mute':'p-good';
   return `<tr>${compact?'':`<td class="n">${fmtDate(x.date)}</td>`}<td><b>${esc(pname(p))}</b> ${x.sample?'<span class="tag">مثال</span>':''}<span class="sub">${esc(pdesc(p))}</span></td>
   <td class="n">${N(x.qty)} × ${moneyT(N(x.unitPrice))}</td><td class="n">${N(x.discount)?moneyT(N(x.discount)):'—'}</td><td class="n"><b>${moneyT(tot)}</b></td>
   ${C()?`<td class="n ${pr>=0?'pos':'neg'}">${moneyT(pr)}</td>`:''}<td><span class="pill ${payCls}">${esc(x.payment||'نقد')}</span></td><td>${esc(x.customer||'—')}</td>${isAdmin()?`<td>${esc(x.by||'—')}</td>`:''}
   <td><div class="rowact">${canDelRec(x)?`<button class="icon-btn del" aria-label="حذف" data-act="del-sale" data-id="${x.id}">${I.trash}</button>`:''}</div></td></tr>`}).join('')}

function saleSheet(pid){

  openSheet(`<h3>بيع: ${esc(p.name)}</h3><p class="sub">${esc([p.brand,pdesc(p)].filter(Boolean).join(' • '))} • متوفر ${m.stock} قطعة</p>

   ${fld('sPrice','سعر القطعة (د.ع)',inp('sPrice','number',N(p.sellPrice),'inputmode="numeric" min="0" step="250"'))}
   ${fld('sDisc','خصم على العملية (د.ع)',inp('sDisc','number','','inputmode="numeric" min="0" step="250" placeholder="0"'))}

   <div class="summary" id="sSum"></div>
   <div id="sErr" class="err" hidden></div>
  </form>
  <div class="sheet-actions"><button class="btn primary" id="sSave">تسجيل البيع</button><button class="btn ghost" id="sCancel">إلغاء</button></div>`,s=>{
    const q=s.querySelector('#sQty');
    const calc=()=>{const qty=Math.max(0,Math.floor(N(q.value)));const tot=qty*N(s.querySelector('#sPrice').value)-N(s.querySelector('#sDisc').value);const c=fifoCost(pid,qty);
      s.querySelector('#sSum').innerHTML=`${C()?`<div><span>الكلفة التقديرية</span><span class="num">${moneyT(c)}</span></div><div><span>الربح</span><span class="num ${tot-c>=0?'pos':'neg'}">${moneyT(tot-c)}</span></div>`:''}<div class="total"><span>المطلوب من الزبون</span><span class="num">${moneyT(tot)}</span></div><div style="font-size:12.5px;color:var(--muted)"><span>يبقى بالمخزن بعد البيع</span><span>${Math.max(0,m.stock-qty)} قطعة</span></div>`};
    s.querySelector('#sMinus').onclick=()=>{q.value=Math.max(1,Math.floor(N(q.value))-1);calc()};

      const err=s.querySelector('#sErr');const qty=Math.floor(N(q.value));const price=N(s.querySelector('#sPrice').value);const disc=N(s.querySelector('#sDisc').value);
      const pay=s.querySelector('#sPay').value;const cust=s.querySelector('#sCust').value.trim();

      if(!(price>0))return show('اكتب سعر القطعة.');

    };
    s.querySelector('#sSave').onclick=save;
    s.querySelector('#sf').addEventListener('submit',e=>{e.preventDefault();save()});
  });

<script>/* Buttons 2.0: ripple, haptic tick, busy spinner, success flash */
(function(){
  const RSEL='.btn,.hbtn,.tab,.chip,.cat,.tgl,.pay-b,.flv,.seg button,.icon-btn,.gear,.sw,.kbtn,.add,.qs button,.big-qs button,.cb,.fab';
  const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

    const b=e.target.closest(RSEL);if(!b||b.disabled||e.button>0||reduce())return;
    const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');
    const solid=b.matches('.primary,.red,.wa,.add,.cta,[aria-pressed="true"],.on,.act,.sell-btn');
    sp.className='rpl'+(solid?'':' dk');sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    b.appendChild(sp);setTimeout(()=>sp.remove(),650);
    try{if(e.pointerType==='touch'&&navigator.vibrate)navigator.vibrate(8)}catch(x){}
  },{passive:true});
  let lastBtn=null,lastAt=0;
  document.addEventListener('click',e=>{const b=e.target.closest('button,.btn');if(b){lastBtn=b;lastAt=Date.now();window.dzLast=b}},true);
  new MutationObserver(ms=>{for(const m of ms){const b=m.target;if(!b.classList||!b.classList.contains('btn'))continue;
    if(b.disabled&&b===lastBtn&&Date.now()-lastAt<1500)b.classList.add('busy');
    else if(!b.disabled&&b.classList.contains('busy')){b.classList.remove('busy');b.classList.add('okf');setTimeout(()=>b.classList.remove('okf'),700)}}})
    .observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});
  window.dzFly=function(from,to){try{if(!from||!to||reduce())return;const a=from.getBoundingClientRect(),z=to.getBoundingClientRect(),f=document.createElement('i');
    f.className='fly';f.style.left=(a.left+a.width/2)+'px';f.style.top=(a.top+a.height/2)+'px';document.body.appendChild(f);
    requestAnimationFrame(()=>{f.style.transform=`translate(${z.left+z.width/2-a.left-a.width/2}px,${z.top+z.height/2-a.top-a.height/2}px) scale(.5) rotate(180deg)`;f.style.opacity='.3'});
    setTimeout(()=>{f.remove();to.classList.remove('pop');void to.offsetWidth;to.classList.add('pop')},660)}catch(x){}};
})();
</script>
